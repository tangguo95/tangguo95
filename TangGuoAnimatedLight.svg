  <style>
    .signature {
      --ink: #083D77;
      --accent: #38D1C4;
      animation: settle 900ms 3.9s ease-out both;
    }

    .stroke {
      fill: none;
      stroke: var(--ink);
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .underline {
      stroke: var(--accent);
      stroke-width: 24;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes settle {
      from { opacity: .88; filter: drop-shadow(0 0 0 rgba(56, 209, 196, 0)); }
      to { opacity: 1; filter: drop-shadow(0 14px 28px rgba(56, 209, 196, .16)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .signature {
        animation: none;
      }
    }
  </style>
